<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="form-card">
    <form action="#" method="post">
      <h2>Profile Form</h2>
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter full name">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter email">
      </div>
      <div class="form-group">
        <label for="role">Password</label>
        <input type="text" id="role" name="role" placeholder="e.g. Password">
      </div>
      <div class="form-group">
        <label for="followers">Role</label>
        <input type="number" id="followers" name="followers" placeholder="e.g. Mern Full Stack Developer">
      </div>
      <div class="form-group">
        <label for="following">Experience</label>
        <input type="number" id="following" name="following" placeholder="1">
      </div>
      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
